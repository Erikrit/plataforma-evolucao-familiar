services:
  postgres:
    image: postgres:16-alpine
    container_name: pef-postgres
    restart: unless-stopped
    ports:
      # 5433 no host evita conflito com PostgreSQL local na 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: pef
      POSTGRES_PASSWORD: pef_dev_local
      POSTGRES_DB: pef
    volumes:
      - pef_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pef -d pef"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pef_postgres_data:
