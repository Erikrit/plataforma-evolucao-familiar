# Homologação na VPS (/opt/pef-homolog). Separado do Compose local (só Postgres).
# Imagens versionadas pelo SHA do git (mesmo SHA para api e web).
# Anexos da aplicação ficam no PostgreSQL (conteudoBase64); o volume do Postgres
# preserva catálogo, famílias fictícias de ensaio e anexos. Sem volume de disco
# separado para uploads.
name: pef-homolog

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pef_homolog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pef_homolog
    # Porta NÃO publicada no host — só a rede interna do Compose.

  migrate:
    image: ${PEF_IMAGE_REGISTRY}/api:${PEF_IMAGE_SHA}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["/app/migrar-e-carregar.sh"]
    networks:
      - pef_homolog

  api:
    image: ${PEF_IMAGE_REGISTRY}/api:${PEF_IMAGE_SHA}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      API_PORT: "3001"
      WEB_ORIGIN: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PEF_INCREMENTO: ${PEF_INCREMENTO:-homolog}
    ports:
      - "127.0.0.1:${PEF_API_HOST_PORT:-3001}:3001"
    networks:
      - pef_homolog

  web:
    image: ${PEF_IMAGE_REGISTRY}/web:${PEF_IMAGE_SHA}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:${PEF_WEB_HOST_PORT:-3000}:3000"
    networks:
      - pef_homolog

volumes:
  pef_homolog_pg:
    name: pef_homolog_pg

networks:
  pef_homolog:
    name: pef_homolog
